server {
    listen 80;
    server_name finance.example.com;

    root /usr/share/nginx/finance-web;
    index index.html;
    charset utf-8;
    client_max_body_size 20m;

    access_log /var/log/nginx/finance-web.access.log;
    error_log  /var/log/nginx/finance-web.error.log warn;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/xml image/svg+xml;

    # 带 hash 的静态资源长期缓存
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # 同源反向代理到后端 Nginx（前端服务器 -> 后端私网 IP:80）
    # 这样浏览器只访问前端域名，无需 CORS，JWT 也不跨域。
    location /api/ {
        proxy_pass http://BACKEND_PRIVATE_IP:80;
        proxy_http_version 1.1;
        proxy_set_header Host api.example.com;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
