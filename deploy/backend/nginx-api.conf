upstream finance_api {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.example.com;

    client_max_body_size 20m;
    charset utf-8;

    access_log /var/log/nginx/finance-api.access.log;
    error_log  /var/log/nginx/finance-api.error.log warn;

    # Django admin / DRF static files
    location /static/ {
        alias /opt/finance/backend/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Internal health check (optional)
    location = /health {
        proxy_pass http://finance_api/api/v1/health;
        proxy_set_header Host $host;
        # Avoid SECURE_SSL_REDIRECT for the local readiness probe.
        proxy_set_header X-Forwarded-Proto https;
    }

    location / {
        proxy_pass http://finance_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Preserve https from the frontend Nginx; empty for direct local HTTP.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

        # AI 分析可能因 429 重试等待，最长约 3 分钟
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
}
